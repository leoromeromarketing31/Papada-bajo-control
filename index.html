<!doctype html>
<html lang="es" class="light">
  <head>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          var desc = {
            get: function() { return customFetch; },
            set: function(v) { customFetch = v; },
            configurable: true,
            enumerable: true
          };
          Object.defineProperty(window, 'fetch', desc);
          if (typeof globalThis !== 'undefined') {
            Object.defineProperty(globalThis, 'fetch', desc);
          }
          if (typeof self !== 'undefined') {
            Object.defineProperty(self, 'fetch', desc);
          }
        } catch(e) {
          console.warn('Failed to redefine fetch getter/setter:', e);
        }
      })();
    </script>
